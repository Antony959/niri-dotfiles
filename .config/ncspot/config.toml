[theme]
# Fundo geral do app
background = "#121212"

# Texto principal e secundário
primary   = "white"
secondary = "#b3b3b3"

# Títulos (nome de playlist, etc.)
title = "#1db954"

# Faixa em reprodução
playing          = "#1db954"
playing_selected = "#1db954"
playing_bg       = "#121212"

# Item selecionado na lista
highlight    = "white"
highlight_bg = "#212121"

# Mensagens de erro
error    = "white"
error_bg = "red"

# Barra de status (bottom)
statusbar          = "black"
statusbar_progress = "#1db954"
statusbar_bg       = "#1db954"

# Linha de comando (barra de busca/comandos)
cmdline    = "white"
cmdline_bg = "#121212"

# Cor de destaque para matches da busca
search_match = "#1db954"

[keybindings]
"x" = "playpause"
"Shift+p" = "noop"
"Shift+s" = "noop"



